<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Delicacy</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;

  background: 
    linear-gradient(rgba(43,2,8,0.6), rgba(106,4,15,0.6)),
    url('../../public/img/background_delicacy.png');

  background-size: cover;
  background-position: center;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* CONTAINER */
.container {
  width: 920px;
  height: 560px;
  display: flex;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}

/* LADO ESQUERDO */
.left {
  width: 50%;

  background: 
    linear-gradient(rgba(43,2,8,0.85), rgba(106,4,15,0.85)),
    url('../../public/img/tecido.png');

  background-size: cover;
  background-position: center;

  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
}

/* LOGO */
.left h1 {
  font-family: 'Playfair Display', serif;
  font-size: 80px;
  letter-spacing: 1px;


  color: #D4AF37;

  background: linear-gradient(180deg, #f5d27a, #c6a969, #a67c2d);

  background-clip: text;
  -webkit-background-clip: text;

  color: transparent;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 2px 4px rgba(0,0,0,0.4),
    0 6px 20px rgba(0,0,0,0.5);
}

.linha-decorativa {
  width: 320px; 
  height: 2px;
  margin: 15px 0 25px 0;

  background: linear-gradient(to right, transparent,  #8f7214, transparent);
  position: relative;
}

.linha-decorativa::after {
  content: "✦";
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  color: #8f7214;
  font-size: 18px;
}

.left p {
  font-family: 'Playfair Display', serif;
  line-height: 1.6;
  opacity: 0.9;
  max-width: 320px;

  color: #f5e6c8; 
  opacity: 0.95;

  max-width: 340px;
}

/* LADO DIREITO */
.right {
  width: 50%;
  background: linear-gradient(135deg, #ffffff, #fff6f2, #fcebea);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FORM */
.form-box {
  width: 340px;
}

.form-box h2 {
  color: #6A040F;
  margin-bottom: 25px;
}

/* INPUTS */
.input-group {
  margin-bottom: 15px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #eee;
  outline: none;
  transition: 0.3s;
  background: rgba(255,255,255,0.8);
}

.input-group input:focus {
  border-color: #C6A969;
  box-shadow: 0 0 0 2px rgba(198,169,105,0.2);
}

/* BOTÃO */
.btn {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, #6A040F, #8a2a33);
  color: #FFFFFF;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(106,4,15,0.4);
}

/* TOGGLE */
.toggle {
  margin-top: 15px;
  font-size: 14px;
  color: #666;
  cursor: pointer;
}

.toggle span {
  color: #6A040F;
  font-weight: bold;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <h1>Delicacy</h1>
    <div class="linha-decorativa"></div>
    <p>
      Leve sofisticação ao seu cardápio digital.
      Conecte sua empresa aos clientes com elegância e identidade.
    </p>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="form-box">

      <!-- LOGIN -->
      <div id="loginForm">
        <h2>Entrar</h2>

        <div class="input-group">
          <input type="email" placeholder="Email">
        </div>

        <div class="input-group">
          <input type="password" placeholder="Senha">
        </div>

        <button class="btn">Entrar</button>

        <div class="toggle" onclick="toggleForms()">
          Não tem conta? <span>Cadastrar</span>
        </div>
      </div>

      <!-- CADASTRO -->
      <div id="registerForm" class="hidden">
        <h2>Cadastrar Empresa</h2>

        <div class="input-group">
          <input type="text" placeholder="Nome da empresa">
        </div>

        <div class="input-group">
          <input type="email" placeholder="Email">
        </div>

        <div class="input-group">
          <input type="password" placeholder="Senha">
        </div>

        <button class="btn">Cadastrar</button>

        <div class="toggle" onclick="toggleForms()">
          Já tem conta? <span>Entrar</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
function toggleForms() {
  document.getElementById("loginForm").classList.toggle("hidden");
  document.getElementById("registerForm").classList.toggle("hidden");
}
</script>

</body>
</html>
